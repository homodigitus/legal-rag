[project]
name = "legal-rag"
version = "0.1.0"
description = "Yerel LLM ile Hukuki Metin Analizi - RAG tabanli sozlesme QA sistemi (CUAD dataset)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.38.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "chromadb>=0.5.5",
    "langchain-chroma>=0.1.4",
    "sentence-transformers>=3.1.0",
    "ollama>=0.3.3",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.3.1",
    "tqdm>=4.66.5",
    "pydantic>=2.9.0",
    "agno",
    "openai>=3.0.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "pytest>=8.3.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "agents", "skills", "db", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"
