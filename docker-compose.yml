services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eksun-legal-rag-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Container icinden host'ta calisan Ollama'ya erismek icin
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./db/chroma_store:/app/db/chroma_store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped

  # Yerel LLM servisi (istege bagli: host'ta zaten Ollama kuruluysa bu servisi
  # docker-compose.yml'den kaldirip OLLAMA_BASE_URL'i host'a yonlendirebilirsin)
  ollama:
    image: ollama/ollama:latest
    container_name: eksun-legal-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # GPU kullanmak icin (NVIDIA + nvidia-container-toolkit gerekir):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_models:
